<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aviator Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a10;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    min-height: 64px;
    background: #11141d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid #252a36;
    gap: 8px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #ff3b30;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.balance {
    background: #1b202b;
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.header-right button {
    border: none;
    border-radius: 9px;
    padding: 9px 11px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.deposit {
    background: #159447;
}

.withdraw {
    background: #b52b2b;
}

.header-icon {
    width: 38px;
    height: 38px;
    padding: 0 !important;
    background: #1b202b;
    font-size: 18px;
}

.logout {
    background: #252a34;
}

/* =========================
   GAME
========================= */

.game {
    margin: 10px;
    height: 390px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #263653 0%,
            #141c2d 35%,
            #080a10 78%
        );
}

.game::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .12;

    background-image:
        linear-gradient(#8892a8 1px, transparent 1px),
        linear-gradient(90deg, #8892a8 1px, transparent 1px);

    background-size: 55px 55px;

    transform:
        perspective(350px)
        rotateX(55deg)
        scale(1.5);

    transform-origin: bottom;
}

/* =========================
   HISTORY
========================= */

.history {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    gap: 7px;

    overflow-x: auto;

    z-index: 20;
}

.history::-webkit-scrollbar {
    display: none;
}

.history span {
    flex-shrink: 0;

    background: #1a202c;

    padding: 7px 11px;

    border-radius: 15px;

    font-size: 12px;

    color: #65d6ff;
}

/* =========================
   GAME STATUS
========================= */

.game-status {
    position: absolute;

    top: 52px;
    left: 14px;
    right: 14px;

    display: flex;
    justify-content: space-between;

    z-index: 20;

    font-size: 11px;
    color: #9da5b5;
}

.game-status span:first-child {
    color: #ff3b30;
    font-weight: bold;
}

/* =========================
   MULTIPLIER
========================= */

.multiplier {
    position: absolute;

    top: 43%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 20;

    width: 100%;
}

.multiplier small {
    display: block;

    margin-bottom: 6px;

    color: #aeb5c5;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.multiplier strong {
    display: block;

    font-size: 64px;

    font-weight: 900;

    letter-spacing: -2px;

    color: white;

    text-shadow:
        0 0 10px rgba(255,255,255,.35),
        0 0 25px rgba(255,23,68,.25);
}

.multiplier strong.crashed {
    color: #ff1744;

    text-shadow:
        0 0 15px rgba(255,23,68,.7),
        0 0 35px rgba(255,23,68,.4);
}

/* =========================
   FLIGHT PATH
========================= */

.flight-path {
    position: absolute;

    width: 90%;
    height: 230px;

    left: 3%;
    bottom: 15px;

    border-top: 3px solid #ff1744;

    border-radius: 50%;

    transform: rotate(-18deg);

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,23,68,.8)
        );

    opacity: .85;

    z-index: 2;
}

.flight-path::after {
    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    top: -10px;
    left: 0;

    border-top:
        20px solid
        rgba(255,23,68,.08);

    border-radius: 50%;
}

/* =========================
   PLANE
========================= */

.plane {
    position: absolute;

    left: 8%;
    bottom: 35px;

    width: 100px;
    height: 55px;

    z-index: 10;

    transition:
        left .08s linear,
        bottom .08s linear,
        transform .08s linear;
}

.aircraft {
    width: 100px;
    height: 55px;

    display: block;

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,23,68,.8)
        )
        drop-shadow(
            0 0 14px
            rgba(255,23,68,.35)
        );
}

/* =========================
   GAME MESSAGE
========================= */

.game-message {
    position: absolute;

    bottom: 12px;
    left: 15px;
    right: 15px;

    text-align: center;

    color: #8992a5;

    font-size: 11px;

    z-index: 20;
}

/* =========================
   ROUND OVERLAY
========================= */

.round-overlay {
    position: absolute;

    inset: 0;

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    background: rgba(5,7,12,.72);

    backdrop-filter: blur(3px);

    z-index: 50;
}

.round-overlay.show {
    display: flex;
}

.crash-title {
    color: #ff1744;

    font-size: 42px;

    font-weight: 900;

    text-shadow:
        0 0 15px rgba(255,23,68,.7),
        0 0 35px rgba(255,23,68,.35);
}

.crash-value {
    margin-top: 5px;

    font-size: 58px;

    font-weight: 900;
}

.waiting {
    margin-top: 18px;

    color: #aeb5c5;

    font-size: 15px;
}

.countdown {
    margin-top: 5px;

    font-size: 42px;

    font-weight: 900;

    color: white;
}

/* =========================
   BET CONTROLS
========================= */

.controls {
    padding: 8px;

    display: grid;

    grid-template-columns: 1fr;

    gap: 8px;

    background: #080808;
}

.bet-card {
    background: #121212;

    border: 1px solid #202020;

    border-radius: 18px;

    padding: 10px;
}

.tabs {
    width: 62%;

    margin: 0 auto 10px;

    display: flex;

    background: #0b0b0b;

    border-radius: 24px;

    padding: 3px;
}

.tabs button {
    flex: 1;

    border: none;

    background: transparent;

    color: #777;

    padding: 8px;

    border-radius: 20px;

    font-size: 14px;
}

.tabs .active {
    background: #242424;

    color: #ddd;
}

.bet-layout {
    display: grid;

    grid-template-columns: 42% 58%;

    gap: 8px;

    align-items: center;
}

.bet-options {
    min-width: 0;
}

.amount {
    display: grid;

    grid-template-columns: 38px 1fr 38px;

    gap: 5px;

    align-items: center;
}

.amount-btn {
    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: #1d222c;

    color: #aaa;

    font-size: 23px;

    font-weight: bold;

    cursor: pointer;
}

.amount input {
    width: 100%;

    height: 38px;

    border: none;

    background: transparent;

    color: #aaa;

    text-align: center;

    font-size: 18px;

    font-weight: bold;

    outline: none;
}

.quick {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 4px;

    margin-top: 5px;
}

.quick button {
    border: none;

    background: #151515;

    color: #777;

    padding: 7px 3px;

    border-radius: 18px;

    font-size: 12px;

    cursor: pointer;
}

.big-bet {
    min-height: 105px;

    width: 100%;

    border: 2px solid #42933a;

    border-radius: 15px;

    background: #126b0b;

    color: #aaa;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    cursor: pointer;
}

.big-bet.cashout {
    background: #159447;
    border-color: #48b83d;
}

.big-bet span {
    font-size: 25px;
    font-weight: bold;
}

.big-bet small {
    margin-top: 2px;

    font-size: 20px;
}

.big-bet:disabled {
    opacity: .35;

    cursor: not-allowed;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    header {
        padding: 7px 8px;

        flex-wrap: wrap;
    }

    .logo {
        font-size: 17px;
    }

    .header-right {
        gap: 4px;
    }

    .balance {
        padding: 8px 9px;

        font-size: 11px;
    }

    .header-right button {
        padding: 8px 6px;

        font-size: 10px;
    }

    .header-icon {
        width: 34px;
        height: 34px;

        padding: 0 !important;

        font-size: 16px !important;
    }

    .game {
        height: 360px;

        margin: 8px;
    }

    .multiplier {
        top: 44%;
    }

    .multiplier strong {
        font-size: 50px;
    }

    .plane {
        width: 80px;
        height: 45px;
    }

    .aircraft {
        width: 80px;
        height: 45px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .quick button {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        ✈ <span>AVIATOR</span>
    </div>

    <div class="header-right">

        <div class="balance">
            $<span id="balance">1000.00</span>
        </div>

        <button
            class="deposit"
            onclick="alert('Deposit coming soon')">
            Deposit
        </button>

        <button
            class="withdraw"
            onclick="alert('Withdraw coming soon')">
            Withdraw
        </button>

        <button
            class="header-icon"
            onclick="alert('Menu coming soon')">
            ☰
        </button>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<!-- =========================
     GAME
========================= -->

<section class="game">

    <div
        class="round-overlay"
        id="roundOverlay">

        <div class="crash-title">
            CRASHED
        </div>

        <div
            class="crash-value"
            id="crashValue">
            1.00x
        </div>

        <div class="waiting">
            Waiting for next round...
        </div>

        <div
            class="countdown"
            id="countdown">
            10
        </div>

    </div>


    <div
        class="history"
        id="history">

        <span>1.24x</span>
        <span>2.15x</span>
        <span>1.08x</span>
        <span>4.72x</span>
        <span>1.63x</span>
        <span>8.41x</span>

    </div>


    <div class="game-status">

        <span>AVIATOR</span>

        <span id="roundStatus">
            WAITING
        </span>

    </div>


    <div class="multiplier">

        <small>
            Current multiplier
        </small>

        <strong id="multiplier">
            1.00x
        </strong>

    </div>


    <div class="flight-path"></div>


    <div
        class="plane"
        id="plane">

        <svg
            class="aircraft"
            viewBox="0 0 200 100">

            <path
                d="M10 58 L115 45 L175 20 L188 25 L145 55 L188 70 L175 78 L115 62 L45 75 L25 68 L55 57 Z"
                fill="#ff1744"/>

            <path
                d="M75 50 L105 15 L120 18 L105 52 Z"
                fill="#ff3b30"/>

            <path
                d="M75 58 L105 88 L120 84 L105 56 Z"
                fill="#d90032"/>

            <circle
                cx="177"
                cy="28"
                r="5"
                fill="#ffb3c1"/>

        </svg>

    </div>


    <div
        class="game-message"
        id="gameMessage">

        Waiting for next round...

    </div>

</section>


<!-- =========================
     BETTING PANELS
========================= -->

<section class="controls">


    <!-- =====================
         PANEL 1
    ====================== -->

    <div class="bet-card">

        <div class="tabs">

            <button class="active">
                Bet
            </button>

            <button>
                Auto
            </button>

        </div>


        <div class="bet-layout">

            <div class="bet-options">

                <div class="amount">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(1, -1)">
                        −
                    </button>

                    <input
                        type="number"
                        id="betAmount1"
                        value="10"
                        min="1">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(1, 1)">
                        +
                    </button>

                </div>


                <div class="quick">

                    <button
                        onclick="setAmount(1, 100)">
                        100
                    </button>

                    <button
                        onclick="setAmount(1, 250)">
                        250
                    </button>

                    <button
                        onclick="setAmount(1, 1000)">
                        1,000
                    </button>

                    <button
                        onclick="setAmount(1, 25000)">
                        25,000
                    </button>

                </div>

            </div>


            <button
                class="big-bet"
                id="betButton1"
                onclick="toggleBet(1)">

                <span>
                    Bet
                </span>

                <small id="display1">
                    10.00
                </small>

            </button>

        </div>

    </div>


    <!-- =====================
         PANEL 2
    ====================== -->

    <div class="bet-card">

        <div class="tabs">

            <button class="active">
                Bet
            </button>

            <button>
                Auto
            </button>

        </div>


        <div class="bet-layout">

            <div class="bet-options">

                <div class="amount">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(2, -1)">
                        −
                    </button>

                    <input
                        type="number"
                        id="betAmount2"
                        value="10"
                        min="1">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(2, 1)">
                        +
                    </button>

                </div>


                <div class="quick">

                    <button
                        onclick="setAmount(2, 100)">
                        100
                    </button>

                    <button
                        onclick="setAmount(2, 250)">
                        250
                    </button>

                    <button
                        onclick="setAmount(2, 1000)">
                        1,000
                    </button>

                    <button
                        onclick="setAmount(2, 25000)">
                        25,000
                    </button>

                </div>

            </div>


            <button
                class="big-bet"
                id="betButton2"
                onclick="toggleBet(2)">

                <span>
                    Bet
                </span>

                <small id="display2">
                    10.00
                </small>

            </button>

        </div>

    </div>

</section>


<script>

/* ==========================================
   AVIATOR DASHBOARD JAVASCRIPT
========================================== */


/* ==========================================
   LOGIN PROTECTION
========================================== */

if (
    localStorage.getItem("aviatorLoggedIn") !== "true"
) {
    window.location.replace("login.html");
}


/* ==========================================
   GAME VARIABLES
========================================== */

let balance = 1000;

let currentMultiplier = 1;

let crashed = false;

let roundFlying = false;

let bettingOpen = false;

let gameTimer = null;

let countdownTimer = null;

let bets = {
    1: false,
    2: false
};

let betAmounts = {
    1: 10,
    2: 10
};


/* ==========================================
   DOM HELPERS
========================================== */

function getElement(id) {
    return document.getElementById(id);
}


/* ==========================================
   BALANCE
========================================== */

function updateBalance() {

    const balanceDisplay =
        getElement("balance");

    if (balanceDisplay) {

        balanceDisplay.textContent =
            balance.toFixed(2);

    }
}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.removeItem(
        "aviatorLoggedIn"
    );

    window.location.href =
        "index.html";
}


/* ==========================================
   BET AMOUNT
========================================== */

function setAmount(panel, amount) {

    const input =
        getElement(
            "betAmount" + panel
        );

    if (!input) return;

    /*
       Do not allow changing the amount
       after this panel has already bet.
    */

    if (bets[panel]) {
        return;
    }

    input.value = amount;

    betAmounts[panel] = amount;

    updateBetDisplay(panel);
}


function changeAmount(panel, change) {

    const input =
        getElement(
            "betAmount" + panel
        );

    if (!input) return;

    if (bets[panel]) {
        return;
    }

    let value =
        parseFloat(input.value) || 1;

    value += change;

    if (value < 1) {
        value = 1;
    }

    input.value = value;

    betAmounts[panel] = value;

    updateBetDisplay(panel);
}


function updateBetDisplay(panel) {

    const input =
        getElement(
            "betAmount" + panel
        );

    const display =
        getElement(
            "display" + panel
        );

    if (!input || !display) {
        return;
    }

    if (!bets[panel]) {

        display.textContent =
            parseFloat(
                input.value || 0
            ).toFixed(2);

    }
}


/* ==========================================
   ENABLE / DISABLE BETTING
========================================== */

function updateBetButtons() {

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        const button =
            getElement(
                "betButton" + panel
            );

        if (!button) {
            continue;
        }


        /*
           If this panel already has a bet,
           keep CASH OUT available while
           the plane is flying.
        */

        if (bets[panel]) {

            button.disabled = false;

            continue;
        }


        /*
           If there is no bet:
           - waiting = enabled
           - flying = disabled
        */

        button.disabled =
            !bettingOpen;
    }
}


/* ==========================================
   PLACE BET / CASH OUT
========================================== */

function toggleBet(panel) {

    /*
       If the panel already has a bet,
       clicking the button means CASH OUT.
    */

    if (bets[panel]) {

        cashOutPanel(panel);

        return;
    }


    /*
       IMPORTANT:
       No new bets while plane is flying.
    */

    if (!bettingOpen) {

        alert(
            "Betting is closed. " +
            "Wait for the next round."
        );

        return;
    }


    const input =
        getElement(
            "betAmount" + panel
        );

    if (!input) {
        return;
    }


    const amount =
        parseFloat(input.value);


    if (!amount || amount <= 0) {

        alert(
            "Enter a valid amount."
        );

        return;
    }


    if (amount > balance) {

        alert(
            "Insufficient demo balance."
        );

        return;
    }


    /*
       Remove money from balance.
    */

    balance -= amount;


    betAmounts[panel] =
        amount;

    bets[panel] =
        true;


    const button =
        getElement(
            "betButton" + panel
        );


    if (button) {

        button.innerHTML =
            "<span>CASH OUT</span>" +
            "<small id=\"display" +
            panel +
            "\">" +
            amount.toFixed(2) +
            "</small>";

        button.style.background =
            "#e66b19";

        /*
           Existing bet remains available
           during flight.
        */

        button.disabled =
            false;
    }


    updateBalance();

    updateAllPotentialWinnings();
}


/* ==========================================
   CASH OUT
========================================== */

function cashOutPanel(panel) {

    if (!bets[panel]) {
        return;
    }


    /*
       Cash out only while the round
       is actually flying.
    */

    if (!roundFlying) {
        return;
    }


    const amount =
        betAmounts[panel];


    const winnings =
        amount *
        currentMultiplier;


    balance += winnings;


    bets[panel] =
        false;


    const button =
        getElement(
            "betButton" + panel
        );


    if (button) {

        button.innerHTML =
            "<span>BET</span>" +
            "<small id=\"display" +
            panel +
            "\">" +
            amount.toFixed(2) +
            "</small>";

        button.style.background =
            "#126b0b";

        /*
           Since the plane is still flying,
           this panel cannot place another bet.
        */

        button.disabled =
            true;
    }


    updateBalance();

    updateAllPotentialWinnings();


    alert(
        "Panel " +
        panel +
        " cashed out at " +
        currentMultiplier.toFixed(2) +
        "x"
    );
}


/* ==========================================
   UPDATE POTENTIAL WINNINGS
========================================== */

function updateAllPotentialWinnings() {

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        if (!bets[panel]) {
            continue;
        }


        const potential =
            betAmounts[panel] *
            currentMultiplier;


        const display =
            getElement(
                "display" + panel
            );


        if (display) {

            display.textContent =
                potential.toFixed(2);

        }
    }
}


/* ==========================================
   RESET BET BUTTON
========================================== */

function resetBetButton(panel) {

    const button =
        getElement(
            "betButton" + panel
        );

    const input =
        getElement(
            "betAmount" + panel
        );


    if (!button) {
        return;
    }


    let amount = 10;


    if (input) {

        amount =
            parseFloat(
                input.value
            ) || 10;

    }


    button.innerHTML =
        "<span>BET</span>" +
        "<small id=\"display" +
        panel +
        "\">" +
        amount.toFixed(2) +
        "</small>";


    button.style.background =
        "#126b0b";


    button.disabled =
        false;
}


/* ==========================================
   CRASH ACTIVE BETS
========================================== */

function crashAllBets() {

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        if (!bets[panel]) {
            continue;
        }


        /*
           The player's stake is lost
           because they did not cash out.
        */

        bets[panel] =
            false;


        const button =
            getElement(
                "betButton" + panel
            );


        if (button) {

            const input =
                getElement(
                    "betAmount" + panel
                );


            const amount =
                input
                    ? parseFloat(input.value) || 10
                    : 10;


            button.innerHTML =
                "<span>BET</span>" +
                "<small id=\"display" +
                panel +
                "\">" +
                amount.toFixed(2) +
                "</small>";


            button.style.background =
                "#126b0b";


            button.disabled =
                true;
        }
    }


    updateAllPotentialWinnings();
}


/* ==========================================
   PLANE POSITION
========================================== */

function movePlane() {

    const plane =
        getElement("plane");

    if (!plane) {
        return;
    }


    /*
       Logarithmic-style movement.

       This prevents the plane from
       disappearing too quickly when the
       multiplier becomes very high.
    */

    const progress =
        Math.min(
            Math.log(currentMultiplier) /
            Math.log(100),
            1
        );


    const left =
        8 +
        progress * 78;


    const bottom =
        40 +
        progress * 190;


    const rotation =
        -8 -
        progress * 14;


    plane.style.left =
        left + "%";


    plane.style.bottom =
        bottom + "px";


    plane.style.transform =
        "rotate(" +
        rotation +
        "deg)";
}


/* ==========================================
   SHOW WAITING COUNTDOWN
========================================== */

function startCountdown() {

    bettingOpen =
        true;

    roundFlying =
        false;

    crashed =
        false;


    currentMultiplier =
        1;


    const overlay =
        getElement(
            "roundOverlay"
        );


    const countdownDisplay =
        getElement(
            "countdown"
        );


    const crashTitle =
        document.querySelector(
            ".crash-title"
        );


    const crashValue =
        getElement(
            "crashValue"
        );


    const roundStatus =
        getElement(
            "roundStatus"
        );


    const gameMessage =
        getElement(
            "gameMessage"
        );


    /*
       Hide crash message.
    */

    if (overlay) {

        overlay.classList.remove(
            "show"
        );

    }


    if (crashTitle) {

        crashTitle.style.display =
            "none";

    }


    if (crashValue) {

        crashValue.style.display =
            "none";

    }


    if (countdownDisplay) {

        countdownDisplay.style.display =
            "block";

        countdownDisplay.textContent =
            "10";
    }


    if (roundStatus) {

        roundStatus.textContent =
            "WAITING FOR NEXT ROUND";

    }


    if (gameMessage) {

        gameMessage.textContent =
            "Place your bets";

    }


    /*
       Reset both panels for the
       new betting period.
    */

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        bets[panel] =
            false;

        resetBetButton(panel);
    }


    updateBetButtons();


    let countdown =
        10;


    clearInterval(
        countdownTimer
    );


    countdownTimer =
        setInterval(
            function () {

                countdown--;


                if (countdownDisplay) {

                    countdownDisplay.textContent =
                        countdown;

                }


                if (countdown <= 0) {

                    clearInterval(
                        countdownTimer
                    );

                    startFlyingRound();
                }

            },
            1000
        );
}


/* ==========================================
   START FLYING ROUND
========================================== */

function startFlyingRound() {

    bettingOpen =
        false;

    roundFlying =
        true;

    crashed =
        false;

    currentMultiplier =
        1;


    const roundStatus =
        getElement(
            "roundStatus"
        );


    const gameMessage =
        getElement(
            "gameMessage"
        );


    const multiplierDisplay =
        getElement(
            "multiplier"
        );


    const plane =
        getElement("plane");


    if (roundStatus) {

        roundStatus.textContent =
            "DEMO ROUND";

    }


    if (gameMessage) {

        gameMessage.textContent =
            "Round in progress";

    }


    if (multiplierDisplay) {

        multiplierDisplay.textContent =
            "1.00x";

        multiplierDisplay.classList.remove(
            "crashed"
        );
    }


    /*
       Reset plane to starting position.
    */

    if (plane) {

        plane.style.left =
            "8%";

        plane.style.bottom =
            "40px";

        plane.style.transform =
            "rotate(-8deg)";
    }


    /*
       Disable NEW bets.

       Existing bets remain enabled
       for CASH OUT.
    */

    updateBetButtons();


    /*
       Random crash point.

       This allows low or high rounds.
    */

    const crashPoint =
        1.20 +
        Math.random() * 98.80;


    clearInterval(
        gameTimer
    );


    gameTimer =
        setInterval(
            function () {

                currentMultiplier +=
                    0.03 +
                    currentMultiplier *
                    0.0015;


                if (multiplierDisplay) {

                    multiplierDisplay.textContent =
                        currentMultiplier.toFixed(2) +
                        "x";

                }


                movePlane();

                updateAllPotentialWinnings();


                /*
                   CRASH
                */

                if (
                    currentMultiplier >=
                    crashPoint
                ) {

                    clearInterval(
                        gameTimer
                    );

                    crashRound();
                }

            },
            100
        );
}


/* ==========================================
   CRASH ROUND
========================================== */

function crashRound() {

    roundFlying =
        false;

    bettingOpen =
        false;

    crashed =
        true;


    const finalMultiplier =
        currentMultiplier;


    const multiplierDisplay =
        getElement(
            "multiplier"
        );


    const overlay =
        getElement(
            "roundOverlay"
        );


    const crashTitle =
        document.querySelector(
            ".crash-title"
        );


    const crashValue =
        getElement(
            "crashValue"
        );


    const countdownDisplay =
        getElement(
            "countdown"
        );


    const roundStatus =
        getElement(
            "roundStatus"
        );


    const gameMessage =
        getElement(
            "gameMessage"
        );


    /*
       Display CRASHED.
    */

    if (multiplierDisplay) {

        multiplierDisplay.textContent =
            "CRASHED";

        multiplierDisplay.classList.add(
            "crashed"
        );
    }


    /*
       Show crash overlay.
    */

    if (overlay) {

        overlay.classList.add(
            "show"
        );

    }


    if (crashTitle) {

        crashTitle.style.display =
            "block";

    }


    if (crashValue) {

        crashValue.style.display =
            "block";

        crashValue.textContent =
            finalMultiplier.toFixed(2) +
            "x";

    }


    if (countdownDisplay) {

        countdownDisplay.style.display =
            "none";

    }


    if (roundStatus) {

        roundStatus.textContent =
            "CRASHED";

    }


    if (gameMessage) {

        gameMessage.textContent =
            "Waiting for next round...";

    }


    /*
       Remove all bets that were not
       cashed out.
    */

    crashAllBets();


    /*
       Make sure no new bets can be
       placed during the crash.
    */

    updateBetButtons();


    /*
       Add crash result to history.
    */

    addHistoryResult(
        finalMultiplier
    );


    /*
       Start next 10-second waiting
       period after 2.5 seconds.
    */

    setTimeout(
        function () {

            startCountdown();

        },
        2500
    );
}


/* ==========================================
   HISTORY
========================================== */

function addHistoryResult(multiplier) {

    const history =
        getElement("history");


    if (!history) {
        return;
    }


    const item =
        document.createElement(
            "span"
        );


    item.textContent =
        multiplier.toFixed(2) +
        "x";


    /*
       Low results are red.
    */

    if (multiplier < 2) {

        item.classList.add(
            "low"
        );

    }


    history.prepend(
        item
    );


    /*
       Keep only the latest results.
    */

    while (
        history.children.length >
        12
    ) {

        history.removeChild(
            history.lastElementChild
        );

    }
}


/* ==========================================
   START
========================================== */

updateBalance();

startCountdown();

</script>
