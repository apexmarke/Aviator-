<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aviator Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a10;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    min-height: 64px;
    background: #11141d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid #252a36;
    gap: 8px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #ff3b30;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.balance {
    background: #1b202b;
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.header-right button {
    border: none;
    border-radius: 9px;
    padding: 9px 11px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.deposit {
    background: #159447;
}

.withdraw {
    background: #b52b2b;
}

.header-icon {
    width: 38px;
    height: 38px;
    padding: 0 !important;
    background: #1b202b;
    font-size: 18px;
}

.logout {
    background: #252a34;
}

/* =========================
   GAME
========================= */

.game {
    margin: 10px;
    height: 390px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #263653 0%,
            #141c2d 35%,
            #080a10 78%
        );
}

/* subtle background grid */

.game::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .12;
    background-image:
        linear-gradient(#8892a8 1px, transparent 1px),
        linear-gradient(90deg, #8892a8 1px, transparent 1px);
    background-size: 55px 55px;
    transform:
        perspective(350px)
        rotateX(55deg)
        scale(1.5);
    transform-origin: bottom;
}

/* history */

.history {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    gap: 7px;

    overflow-x: auto;

    z-index: 20;
}

.history::-webkit-scrollbar {
    display: none;
}

.history span {
    flex-shrink: 0;

    background: #1a202c;
    padding: 7px 11px;

    border-radius: 15px;

    font-size: 12px;
    color: #65d6ff;
}

.history span.low {
    color: #ff6565;
}

/* game status */

.game-status {
    position: absolute;

    top: 52px;
    left: 14px;
    right: 14px;

    display: flex;
    justify-content: space-between;

    z-index: 20;

    font-size: 11px;
    color: #9da5b5;
}

.game-status span:first-child {
    color: #ff3b30;
    font-weight: bold;
}

/* multiplier */

.multiplier {
    position: absolute;

    top: 43%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 20;

    width: 100%;
}

.multiplier small {
    display: block;

    margin-bottom: 6px;

    color: #aeb5c5;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.multiplier strong {
    display: block;

    font-size: 64px;
    font-weight: 900;

    letter-spacing: -2px;

    color: white;

    text-shadow:
        0 0 10px rgba(255,255,255,.35),
        0 0 25px rgba(255,23,68,.25);
}

.multiplier strong.crashed {
    color: #ff1744;

    text-shadow:
        0 0 15px rgba(255,23,68,.7),
        0 0 35px rgba(255,23,68,.4);
}

/* flight path */

.flight-path {
    position: absolute;

    width: 90%;
    height: 230px;

    left: 3%;
    bottom: 15px;

    border-top:
        3px solid #ff1744;

    border-radius: 50%;

    transform: rotate(-18deg);

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,23,68,.8)
        );

    opacity: .85;

    z-index: 2;
}

.flight-path::after {
    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    top: -10px;
    left: 0;

    border-top:
        20px solid
        rgba(255,23,68,.08);

    border-radius: 50%;
}

/* plane */

.plane {
    position: absolute;

    left: 10%;
    bottom: 45px;

    width: 110px;
    height: 60px;

    z-index: 10;

    transition:
        left .1s linear,
        bottom .1s linear,
        transform .1s linear;
}

.aircraft {
    width: 110px;
    height: 60px;

    display: block;

    transform: rotate(-8deg);

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,23,68,.8)
        )
        drop-shadow(
            0 0 14px
            rgba(255,23,68,.35)
        );
}

/* message */

.game-message {
    position: absolute;

    bottom: 12px;
    left: 15px;
    right: 15px;

    text-align: center;

    color: #8992a5;

    font-size: 11px;

    z-index: 20;
}
/* =========================
   CRASH / NEXT ROUND OVERLAY
========================= */

.round-overlay {
    position: absolute;
    inset: 0;

    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: rgba(5, 7, 12, .72);

    backdrop-filter: blur(3px);

    z-index: 50;
}

.round-overlay.show {
    display: flex;
}

.round-overlay .crash-title {
    color: #ff1744;
    font-size: 42px;
    font-weight: 900;
    text-shadow:
        0 0 15px rgba(255,23,68,.7),
        0 0 35px rgba(255,23,68,.35);
}

.round-overlay .crash-value {
    margin-top: 5px;

    font-size: 58px;
    font-weight: 900;
}

.round-overlay .waiting {
    margin-top: 18px;

    color: #aeb5c5;

    font-size: 15px;
}

.round-overlay .countdown {
    margin-top: 5px;

    font-size: 42px;
    font-weight: 900;

    color: white;
}
/* =========================
   AVIATOR BET PANELS
========================= */

.controls {
    padding: 8px;

    display: grid;

    grid-template-columns: 1fr;

    gap: 8px;

    background: #080808;
}

.bet-card {
    background: #121212;

    border: 1px solid #202020;

    border-radius: 18px;

    padding: 10px;
}

.tabs {
    width: 62%;

    margin: 0 auto 10px;

    display: flex;

    background: #0b0b0b;

    border-radius: 24px;

    padding: 3px;
}

.tabs button {
    flex: 1;

    border: none;

    background: transparent;

    color: #777;

    padding: 8px;

    border-radius: 20px;

    font-size: 14px;
}

.tabs .active {
    background: #242424;

    color: #ddd;
}

.bet-layout {
    display: grid;

    grid-template-columns:
        42% 58%;

    gap: 8px;

    align-items: center;
}

.bet-options {
    min-width: 0;
}

.amount {
    display: grid;

    grid-template-columns:
        42px 1fr 42px;

    gap: 5px;

    align-items: center;
}

.amount-btn {
    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: #1d222c;

    color: #aaa;

    font-size: 24px;

    font-weight: bold;
}

.amount input {
    width: 100%;

    height: 42px;

    border: none;

    background: transparent;

    color: #aaa;

    text-align: center;

    font-size: 18px;

    font-weight: bold;

    outline: none;
}

.quick {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 4px;

    margin-top: 5px;
}

.quick button {
    border: none;

    background: #151515;

    color: #777;

    padding: 7px 3px;

    border-radius: 18px;

    font-size: 12px;
}

.big-bet {
    min-height: 105px;

    border: 2px solid #42933a;

    border-radius: 15px;

    background: #126b0b;

    color: #aaa;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    cursor: pointer;
}

.big-bet span {
    font-size: 25px;
}

.big-bet small {
    margin-top: 2px;

    font-size: 20px;
}

.big-bet:disabled {
    opacity: .35;

    cursor: not-allowed;
}

@media (max-width: 650px) {

    .controls {
        padding: 8px;
    }

    .bet-card {
        padding: 9px;
    }

    .bet-layout {
        grid-template-columns:
            42% 58%;
    }

    .tabs {
        width: 62%;
    }

    .amount {
        grid-template-columns:
            38px 1fr 38px;
    }

    .amount-btn {
        width: 38px;
        height: 38px;
    }

    .amount input {
        font-size: 17px;
    }

    .big-bet {
        min-height: 100px;
    }

}
/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    header {
        padding: 7px 8px;

        flex-wrap: wrap;
    }

    .logo {
        font-size: 17px;
    }

    .header-right {
        gap: 4px;
    }

    .balance {
        padding: 8px 9px;

        font-size: 11px;
    }

    .header-right button {
        padding: 8px 6px;

        font-size: 10px;
    }

    .header-icon {
        width: 34px;
        height: 34px;

        padding: 0 !important;

        font-size: 16px !important;
    }

    .logout {
        padding: 8px !important;
    }

    .game {
        height: 360px;

        margin: 8px;
    }

    .multiplier {
        top: 44%;
    }

    .multiplier strong {
        font-size: 50px;
    }

    .plane {
        width: 85px;
        height: 48px;
    }

    .aircraft {
        width: 85px;
        height: 48px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .quick button {
        font-size: 9px;
    }
}

<body>

<header>

    <div class="logo">
        ✈ <span>AVIATOR</span>
    </div>

    <div class="header-right">

        <div class="balance">
            $<span id="balance">1000.00</span>
        </div>

        <button
            class="deposit"
            onclick="alert('Deposit coming soon')">
            Deposit
        </button>

        <button
            class="withdraw"
            onclick="alert('Withdraw coming soon')">
            Withdraw
        </button>

        <button
            class="header-icon"
            onclick="alert('Menu coming soon')"
            aria-label="Menu">
            ☰
        </button>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<section class="game">
<div
    class="round-overlay"
    id="roundOverlay">

    <div class="crash-title">
        CRASHED
    </div>

    <div
        class="crash-value"
        id="crashValue">
        1.00x
    </div>

    <div class="waiting">
        Waiting for next round...
    </div>

    <div
        class="countdown"
        id="countdown">
        3
    </div>

</div>
    <div
        class="history"
        id="history">

        <span>1.24x</span>
        <span>2.15x</span>
        <span>1.08x</span>
        <span>4.72x</span>
        <span>1.63x</span>
        <span>8.41x</span>

    </div>


    <div class="game-status">

        <span>AVIATOR</span>

        <span id="roundStatus">
            DEMO ROUND
        </span>

    </div>


    <div class="multiplier">

        <small>
            Current multiplier
        </small>

        <strong id="multiplier">
            1.00x
        </strong>

    </div>


    <div class="flight-path"></div>


    <div
        class="plane"
        id="plane">

        <svg
            class="aircraft"
            viewBox="0 0 200 100">

            <path
                d="M10 58 L115 45 L175 20 L188 25 L145 55 L188 70 L175 78 L115 62 L45 75 L25 68 L55 57 Z"
                fill="#ff1744"/>

            <path
                d="M75 50 L105 15 L120 18 L105 52 Z"
                fill="#ff3b30"/>

            <path
                d="M75 58 L105 88 L120 84 L105 56 Z"
                fill="#d90032"/>

            <circle
                cx="177"
                cy="28"
                r="5"
                fill="#ffb3c1"/>

        </svg>

    </div>


    <div
        class="game-message"
        id="gameMessage">

        Waiting for round...

    </div>

</section>



<section class="controls">

    <!-- FIRST BET PANEL -->

    <div class="bet-card">

        <div class="tabs">
            <button class="active">Bet</button>
            <button>Auto</button>
        </div>

        <div class="bet-layout">

            <div class="bet-options">

                <div class="amount">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(-1)">
                        −
                    </button>

                    <input
                        type="number"
                        id="betAmount"
                        value="10"
                        min="1">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(1)">
                        +
                    </button>

                </div>

                <div class="quick">

                    <button onclick="setAmount(100)">
                        100
                    </button>

                    <button onclick="setAmount(250)">
                        250
                    </button>

                    <button onclick="setAmount(1000)">
                        1,000
                    </button>

                    <button onclick="setAmount(25000)">
                        25,000
                    </button>

                </div>

            </div>

            <button
                class="big-bet"
                onclick="placeBet()">

                <span>Bet</span>

                <small id="betDisplay">
                    10.00
                </small>

            </button>

        </div>

    </div>


    <!-- SECOND BET PANEL -->

    <div class="bet-card">

        <div class="tabs">

            <button class="active">
                Bet
            </button>

            <button>
                Auto
            </button>

        </div>

        <div class="bet-layout">

            <div class="bet-options">

                <div class="amount">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(-1)">
                        −
                    </button>

                    <input
                        type="number"
                        value="10"
                        readonly>

                    <button
                        class="amount-btn"
                        onclick="changeAmount(1)">
                        +
                    </button>

                </div>

                <div class="quick">

                    <button>100</button>
                    <button>250</button>
                    <button>1,000</button>
                    <button>25,000</button>

                </div>

            </div>

            <button
                class="big-bet"
                id="cashButton"
                onclick="cashOut()"
                disabled>

                <span>Bet</span>

                <small id="potential">
                    10.00
                </small>

            </button>

        </div>

    </div>

</section>

<script>

/* =========================
   LOGIN PROTECTION
========================= */

if (
    localStorage.getItem("aviatorLoggedIn")
    !== "true"
) {

    window.location.replace(
        "login.html"
    );

}


/* =========================
   GAME VARIABLES
========================= */

let balance = 1000;

let currentMultiplier = 10;

let playing = false;

let crashed = false;

let bet = false;

let betAmountValue = 0;

let gameTimer = null;


/* =========================
   BALANCE
========================= */

function updateBalance() {

    document
        .getElementById("balance")
        .textContent =
        balance.toFixed(2);

}


/* =========================
   BET AMOUNT
========================= */

function setAmount(amount) {

    document
        .getElementById("betAmount")
        .value = amount;

}


function changeAmount(change) {

    const input =
        document.getElementById(
            "betAmount"
        );

    let value =
        parseFloat(input.value)
        || 1;

    value += change;

    if (value < 1) {

        value = 1;

    }

    input.value = value;

}


/* =========================
   PLANE POSITION
========================= */

function resetPlane() {

    const plane =
        document.getElementById(
            "plane"
        );

    if (!plane) return;

    plane.style.left =
        "10%";

    plane.style.bottom =
        "45px";

    plane.style.transform =
        "rotate(-8deg)";

}


function movePlane() {

    const plane =
        document.getElementById("plane");

    if (!plane) return;

    /*
       Use logarithmic movement so the
       plane remains visible even at
       very high multipliers such as
       100x, 500x, or higher.
    */

    const progress =
        Math.log(currentMultiplier) /
        Math.log(100);

    const clampedProgress =
        Math.min(Math.max(progress, 0), 1);

    const left =
        10 + clampedProgress * 75;

    const bottom =
        45 + clampedProgress * 170;

    const rotation =
        -8 - clampedProgress * 12;

    plane.style.left =
        left + "%";

    plane.style.bottom =
        bottom + "px";

    plane.style.transform =
        "rotate(" +
        rotation +
        "deg)";
}


/* =========================
   PLACE BET
========================= */

function placeBet() {

    if (!playing) {

        alert(
            "Wait for the next round."
        );

        return;

    }

    if (bet) {

        alert(
            "You already have a bet."
        );

        return;

    }

    const amount =
        parseFloat(
            document
                .getElementById(
                    "betAmount"
                )
                .value
        );

    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "Enter a valid amount."
        );

        return;

    }

    if (amount > balance) {

        alert(
            "Insufficient demo balance."
        );

        return;

    }

    balance -= amount;

    betAmountValue =
        amount;

    bet = true;

    document
        .getElementById(
            "cashButton"
        )
        .disabled = false;

    document
        .getElementById(
            "potential"
        )
        .textContent =
        "$" +
        amount.toFixed(2);

    updateBalance();

}


/* =========================
   CASH OUT
========================= */

function cashOut() {

    if (!bet) return;

    const winnings =
        betAmountValue *
        currentMultiplier;

    balance += winnings;

    bet = false;

    document
        .getElementById(
            "cashButton"
        )
        .disabled = true;

    document
        .getElementById(
            "potential"
        )
        .textContent =
        "$0.00";

    updateBalance();

    alert(
        "Cashed out at " +
        currentMultiplier.toFixed(2) +
        "x"
    );

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "aviatorLoggedIn"
    );

    window.location.href =
        "index.html";

}


/* =========================
   UPDATE BET DISPLAY
========================= */

function updateBetDisplay() {

    const potential =
        document.getElementById(
            "potential"
        );

    const cashMultiplier =
        document.getElementById(
            "cashMultiplier"
        );

    if (bet) {

        const winnings =
            betAmountValue *
            currentMultiplier;

        potential.textContent =
            "$" +
            winnings.toFixed(2);

    }

    cashMultiplier.textContent =
        currentMultiplier.toFixed(2)
        + "x";

}


/* =========================
   UPDATE HISTORY
========================= */

function addHistory(value) {

    const history =
        document.getElementById(
            "history"
        );

    const item =
        document.createElement(
            "span"
        );

    item.textContent =
        value.toFixed(2) + "x";

    if (value < 2) {

        item.classList.add(
            "low"
        );

    }

    history.prepend(item);

    /*
       Keep only the latest 12
       rounds.
    */

    while (
        history.children.length > 12
    ) {

        history.removeChild(
            history.lastElementChild
        );

    }

}


/* =========================
   START GAME
========================= */

function startGame() {

    /*
       Clear any previous timer.
    */

    if (gameTimer) {

        clearInterval(
            gameTimer
        );

    }

    currentMultiplier = 1;

    crashed = false;

    playing = true;

    bet = false;

    betAmountValue = 0;

    resetPlane();

    document
        .getElementById(
            "multiplier"
        )
        .classList.remove(
            "crashed"
        );

    document
        .getElementById(
            "multiplier"
        )
        .textContent =
        "1.00x";

    document
        .getElementById(
            "roundStatus"
        )
        .textContent =
        "LIVE ROUND";

    document
        .getElementById(
            "gameMessage"
        )
        .textContent =
        "Place your demo bet";

    document
        .getElementById(
            "cashButton"
        )
        .disabled = true;

    document
        .getElementById(
            "potential"
        )
        .textContent =
        "$0.00";

    /*
       Random demo crash point.
       Range: 1.50x to 9.50x
    */

    const crashPoint =
        1.5 +
        Math.random() * 8;


    gameTimer =
        setInterval(
            function () {

                currentMultiplier +=
                    0.03;


                /*
                   Update multiplier.
                */

                document
                    .getElementById(
                        "multiplier"
                    )
                    .textContent =
                    currentMultiplier
                        .toFixed(2)
                    + "x";


                /*
                   Move plane continuously.
                */

                movePlane();

                updateBetDisplay();

                if (
                    currentMultiplier >= crashPoint
                ) {

                    clearInterval(gameTimer);

                    gameTimer = null;

                    playing = false;
                    crashed = true;

                    addHistory(currentMultiplier);

                    const multiplier =
                        document.getElementById("multiplier");

                    multiplier.textContent =
                        currentMultiplier.toFixed(2) + "x";

                    multiplier.classList.add("crashed");

                    document.getElementById("roundStatus")
                        .textContent = "CRASHED";

                    document.getElementById("gameMessage")
                        .textContent = "Round crashed";

                    if (bet) {

                        bet = false;
                        betAmountValue = 0;

                        document.getElementById("cashButton")
                            .disabled = true;

                        document.getElementById("potential")
                            .textContent = "$0.00";
                    }

                    let countdown = 10;

const overlay =
    document.getElementById("roundOverlay");

const crashValue =
    document.getElementById("crashValue");

const countdownDisplay =
    document.getElementById("countdown");

crashValue.textContent =
    currentMultiplier.toFixed(2) + "x";

overlay.classList.add("show");

countdownDisplay.textContent =
    countdown;

const countdownTimer =
    setInterval(function () {

        countdown--;

        if (countdown <= 0) {

            clearInterval(countdownTimer);

            overlay.classList.remove("show");

            startGame();

            return;
        }

        countdownDisplay.textContent =
            countdown;

    }, 1000);
                }

            },
            100
        );

}


/* =========================
   INITIALIZE
========================= */

updateBalance();

resetPlane();

startGame();

</script>
