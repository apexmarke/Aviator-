<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aviator Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a10;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    min-height: 64px;
    background: #11141d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid #252a36;
    gap: 8px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #ff3b30;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.balance {
    background: #1b202b;
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.header-right button {
    border: none;
    border-radius: 9px;
    padding: 9px 11px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.deposit {
    background: #159447;
}

.withdraw {
    background: #b52b2b;
}

.header-icon {
    width: 38px;
    height: 38px;
    padding: 0 !important;
    background: #1b202b;
    font-size: 18px;
}

.logout {
    background: #252a34;
}

/* =========================
   GAME
========================= */

.game {
    margin: 10px;
    height: 390px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #263653 0%,
            #141c2d 35%,
            #080a10 78%
        );
}

.game::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .12;

    background-image:
        linear-gradient(#8892a8 1px, transparent 1px),
        linear-gradient(90deg, #8892a8 1px, transparent 1px);

    background-size: 55px 55px;

    transform:
        perspective(350px)
        rotateX(55deg)
        scale(1.5);

    transform-origin: bottom;
}

/* =========================
   HISTORY
========================= */

.history {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    gap: 7px;

    overflow-x: auto;

    z-index: 20;
}

.history::-webkit-scrollbar {
    display: none;
}

.history span {
    flex-shrink: 0;
    background: #1a202c;
    padding: 7px 11px;
    border-radius: 15px;
    font-size: 12px;
    color: #65d6ff;
}

.history span.low {
    color: #ff6565;
}

/* =========================
   GAME STATUS
========================= */

.game-status {
    position: absolute;
    top: 52px;
    left: 14px;
    right: 14px;

    display: flex;
    justify-content: space-between;

    z-index: 20;

    font-size: 11px;
    color: #9da5b5;
}

.game-status span:first-child {
    color: #ff3b30;
    font-weight: bold;
}

/* =========================
   MULTIPLIER
========================= */

.multiplier {
    position: absolute;
    top: 43%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 20;

    width: 100%;
}

.multiplier small {
    display: block;
    margin-bottom: 6px;

    color: #aeb5c5;
    font-size: 11px;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.multiplier strong {
    display: block;

    font-size: 64px;
    font-weight: 900;

    letter-spacing: -2px;

    color: white;

    text-shadow:
        0 0 10px rgba(255,255,255,.35),
        0 0 25px rgba(255,23,68,.25);
}

.multiplier strong.crashed {
    color: #ff1744;

    text-shadow:
        0 0 15px rgba(255,23,68,.7),
        0 0 35px rgba(255,23,68,.4);
}

/* =========================
   FLIGHT PATH
========================= */

.flight-path {
    position: absolute;

    width: 90%;
    height: 230px;

    left: 3%;
    bottom: 15px;

    border-top: 3px solid #ff1744;

    border-radius: 50%;

    transform: rotate(-18deg);

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,23,68,.8)
        );

    opacity: .85;

    z-index: 2;
}

.flight-path::after {
    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    top: -10px;
    left: 0;

    border-top:
        20px solid
        rgba(255,23,68,.08);

    border-radius: 50%;
}

/* =========================
   PLANE
========================= */

.plane {
    position: absolute;

    left: 8%;
    bottom: 35px;

    width: 100px;
    height: 55px;

    z-index: 10;

    transition:
        left .08s linear,
        bottom .08s linear,
        transform .08s linear;
}

.aircraft {
    width: 100px;
    height: 55px;

    display: block;

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,23,68,.8)
        )
        drop-shadow(
            0 0 14px
            rgba(255,23,68,.35)
        );
}

/* =========================
   GAME MESSAGE
========================= */

.game-message {
    position: absolute;

    bottom: 12px;
    left: 15px;
    right: 15px;

    text-align: center;

    color: #8992a5;

    font-size: 11px;

    z-index: 20;
}

/* =========================
   ROUND OVERLAY
========================= */

.round-overlay {
    position: absolute;
    inset: 0;

    display: none;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: rgba(5,7,12,.72);

    backdrop-filter: blur(3px);

    z-index: 50;
}

.round-overlay.show {
    display: flex;
}

.crash-title {
    color: #ff1744;

    font-size: 42px;
    font-weight: 900;

    text-shadow:
        0 0 15px rgba(255,23,68,.7),
        0 0 35px rgba(255,23,68,.35);
}

.crash-value {
    margin-top: 5px;

    font-size: 58px;
    font-weight: 900;
}

.waiting {
    margin-top: 18px;

    color: #aeb5c5;

    font-size: 15px;
}

.countdown {
    margin-top: 5px;

    font-size: 42px;
    font-weight: 900;

    color: white;
}

/* =========================
   BET CONTROLS
========================= */

.controls {
    padding: 8px;

    display: grid;

    grid-template-columns: 1fr;

    gap: 8px;

    background: #080808;
}

.bet-card {
    background: #121212;

    border: 1px solid #202020;

    border-radius: 18px;

    padding: 10px;
}

.tabs {
    width: 62%;

    margin: 0 auto 10px;

    display: flex;

    background: #0b0b0b;

    border-radius: 24px;

    padding: 3px;
}

.tabs button {
    flex: 1;

    border: none;

    background: transparent;

    color: #777;

    padding: 8px;

    border-radius: 20px;

    font-size: 14px;
}

.tabs .active {
    background: #242424;
    color: #ddd;
}

.bet-layout {
    display: grid;

    grid-template-columns: 42% 58%;

    gap: 8px;

    align-items: center;
}

.bet-options {
    min-width: 0;
}

.amount {
    display: grid;

    grid-template-columns: 38px 1fr 38px;

    gap: 5px;

    align-items: center;
}

.amount-btn {
    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: #1d222c;

    color: #aaa;

    font-size: 23px;

    font-weight: bold;

    cursor: pointer;
}

.amount input {
    width: 100%;
    height: 38px;

    border: none;

    background: transparent;

    color: #aaa;

    text-align: center;

    font-size: 18px;

    font-weight: bold;

    outline: none;
}

.quick {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 4px;

    margin-top: 5px;
}

.quick button {
    border: none;

    background: #151515;

    color: #777;

    padding: 7px 3px;

    border-radius: 18px;

    font-size: 12px;

    cursor: pointer;
}

/* =========================
   MAIN BET BUTTON
========================= */

.big-bet {
    min-height: 105px;
    width: 100%;

    border: 2px solid #42933a;

    border-radius: 15px;

    background: #126b0b;

    color: #aaa;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    font-size: 25px;

    cursor: pointer;
}

.big-bet span {
    font-size: 25px;
    font-weight: bold;
}

.big-bet small {
    margin-top: 2px;
    font-size: 20px;
}

/* ACTIVE CASH OUT */

.big-bet.cashout {
    background: #f0a500;
    border-color: #ffc107;
    color: #ffffff;
}

.big-bet.cashout span {
    color: #ffffff;
}

.big-bet.cashout small {
    color: #ffffff;
}
.big-bet.next-round {
    background: #b52b2b;
    border-color: #ff3b30;
    color: white;
}

.big-bet.next-round span {
    color: #ff3b30;
    font-weight: bold;
}
/* NEXT ROUND */

.big-bet.next-round {
    background: #8b1111;
    border-color: #ff1744;
    color: #ff3b30;
}

.big-bet.next-round span {
    color: #ff3b30;
}

.big-bet.next-round small {
    color: #ff6565;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    header {
        padding: 7px 8px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 17px;
    }

    .header-right {
        gap: 4px;
    }

    .balance {
        padding: 8px 9px;
        font-size: 11px;
    }

    .header-right button {
        padding: 8px 6px;
        font-size: 10px;
    }

    .header-icon {
        width: 34px;
        height: 34px;
        padding: 0 !important;
        font-size: 16px !important;
    }

    .game {
        height: 360px;
        margin: 8px;
    }

    .multiplier {
        top: 44%;
    }

    .multiplier strong {
        font-size: 50px;
    }

    .plane {
        width: 80px;
        height: 45px;
    }

    .aircraft {
        width: 80px;
        height: 45px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .quick button {
        font-size: 9px;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        ✈ <span>AVIATOR</span>
    </div>

    <div class="header-right">

        <div class="balance">
            $<span id="balance">1000.00</span>
        </div>

        <button
            class="deposit"
            onclick="alert('Deposit coming soon')">
            Deposit
        </button>

        <button
            class="withdraw"
            onclick="alert('Withdraw coming soon')">

        </button>

        <button
            class="header-icon"
            onclick="alert('Menu coming soon')">
            ☰
        </button>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<!-- =========================
     GAME
========================= -->

<section class="game">

    <div
        class="round-overlay"
        id="roundOverlay">

        <div class="crash-title">
            CRASHED
        </div>

        <div
            class="crash-value"
            id="crashValue">
            1.00x
        </div>

        <div class="waiting">
            Waiting for next round...
        </div>

        <div
            class="countdown"
            id="countdown">
            10
        </div>

    </div>


    <div
        class="history"
        id="history">

        <span>1.24x</span>
        <span>2.15x</span>
        <span>1.08x</span>
        <span>4.72x</span>
        <span>1.63x</span>
        <span>8.41x</span>

    </div>


    <div class="game-status">

        <span>AVIATOR</span>

        <span id="roundStatus">
            WAITING
        </span>

    </div>


    <div class="multiplier">

        <small>
            Current multiplier
        </small>

        <strong id="multiplier">
            1.00x
        </strong>

    </div>


    <div class="flight-path"></div>


    <div
        class="plane"
        id="plane">

        <svg
            class="aircraft"
            viewBox="0 0 200 100">

            <path
                d="M10 58 L115 45 L175 20 L188 25 L145 55 L188 70 L175 78 L115 62 L45 75 L25 68 L55 57 Z"
                fill="#ff1744"/>

            <path
                d="M75 50 L105 15 L120 18 L105 52 Z"
                fill="#ff3b30"/>

            <path
                d="M75 58 L105 88 L120 84 L105 56 Z"
                fill="#d90032"/>

            <circle
                cx="177"
                cy="28"
                r="5"
                fill="#ffb3c1"/>

        </svg>

    </div>


    <div
        class="game-message"
        id="gameMessage">

        Waiting for next round...

    </div>

</section>


<!-- =========================
     BETTING PANELS
========================= -->

<section class="controls">


    <!-- PANEL 1 -->

    <div class="bet-card">

        <div class="tabs">

            <button class="active">
                Bet
            </button>

            <button>
                Auto
            </button>

        </div>


        <div class="bet-layout">

            <div class="bet-options">

                <div class="amount">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(1, -1)">
                        −
                    </button>

                    <input
                        type="number"
                        id="betAmount1"
                        value="10"
                        min="1">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(1, 1)">
                        +
                    </button>

                </div>


                <div class="quick">

                    <button onclick="setAmount(1,100)">
                        100
                    </button>

                    <button onclick="setAmount(1,250)">
                        250
                    </button>

                    <button onclick="setAmount(1,1000)">
                        1,000
                    </button>

                    <button onclick="setAmount(1,25000)">
                        25,000
                    </button>

                </div>

            </div>


            <button
                class="big-bet"
                id="betButton1"
                onclick="toggleBet(1)">

                <span>Bet</span>

                <small id="display1">
                    10.00
                </small>

            </button>

        </div>

    </div>


    <!-- PANEL 2 -->

    <div class="bet-card">

        <div class="tabs">

            <button class="active">
                Bet
            </button>

            <button>
                Auto
            </button>

        </div>


        <div class="bet-layout">

            <div class="bet-options">

                <div class="amount">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(2,-1)">
                        −
                    </button>

                    <input
                        type="number"
                        id="betAmount2"
                        value="10"
                        min="1">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(2,1)">
                        +
                    </button>

                </div>


                <div class="quick">

                    <button onclick="setAmount(2,100)">
                        100
                    </button>

                    <button onclick="setAmount(2,250)">
                        250
                    </button>

                    <button onclick="setAmount(2,1000)">
                        1,000
                    </button>

                    <button onclick="setAmount(2,25000)">
                        25,000
                    </button>

                </div>

            </div>


            <button
                class="big-bet"
                id="betButton2"
                onclick="toggleBet(2)">

                <span>Bet</span>

                <small id="display2">
                    10.00
                </small>

            </button>

        </div>

    </div>

</section>


<script>

/* ==========================================
   AVIATOR DASHBOARD
   TWO-PANEL + NEXT-ROUND BETTING
========================================== */

/* LOGIN PROTECTION */
if (
    localStorage.getItem("aviatorLoggedIn") !== "true"
) {
    window.location.replace("login.html");
}


/* ==========================================
   GAME VARIABLES
========================================== */

let balance = 1000;

let currentMultiplier = 1;

let roundFlying = false;

let bettingOpen = false;

let crashed = false;

let gameTimer = null;

let countdownTimer = null;


/* Current-round bets */
let bets = {
    1: false,
    2: false
};

let betAmounts = {
    1: 10,
    2: 10
};


/* Next-round bets */
let nextBets = {
    1: false,
    2: false
};

let nextBetAmounts = {
    1: 10,
    2: 10
};


/* ==========================================
   HELPER
========================================== */

function el(id) {
    return document.getElementById(id);
}


/* ==========================================
   BALANCE
========================================== */

function updateBalance() {

    const display = el("balance");

    if (display) {
        display.textContent =
            balance.toFixed(2);
    }
}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.removeItem(
        "aviatorLoggedIn"
    );

    window.location.href =
        "index.html";
}


/* ==========================================
   AMOUNT
========================================== */

function setAmount(panel, amount) {

    const input =
        el("betAmount" + panel);

    if (!input) {
        return;
    }

    if (
        bets[panel] ||
        nextBets[panel]
    ) {
        return;
    }

    input.value = amount;

    updateDisplay(panel);
}


function changeAmount(panel, change) {

    const input =
        el("betAmount" + panel);

    if (!input) {
        return;
    }

    if (
        bets[panel] ||
        nextBets[panel]
    ) {
        return;
    }

    let value =
        parseFloat(input.value) || 1;

    value += change;

    if (value < 1) {
        value = 1;
    }

    input.value = value;

    updateDisplay(panel);
}


/* ==========================================
   DISPLAY
========================================== */

function updateDisplay(panel) {

    const input =
        el("betAmount" + panel);

    const display =
        el("display" + panel);

    if (!input || !display) {
        return;
    }

    if (bets[panel]) {

        display.textContent =
            (
                betAmounts[panel] *
                currentMultiplier
            ).toFixed(2);

        return;
    }

    if (nextBets[panel]) {

        display.textContent =
            nextBetAmounts[panel]
                .toFixed(2);

        return;
    }

    display.textContent =
        parseFloat(input.value || 0)
            .toFixed(2);
}


/* ==========================================
   UPDATE BET BUTTON
========================================== */

function updateBetButton(panel) {

    const button =
        document.getElementById(
            "betButton" + panel
        );

    if (!button) {
        return;
    }


    /* =========================
       CURRENT ROUND BET
    ========================= */

    if (bets[panel]) {

        button.classList.remove(
            "next-round"
        );

        button.classList.add(
            "cashout"
        );

        button.innerHTML =
            "<span>CASH OUT</span>" +
            "<small id=\"display" +
            panel +
            "\">" +
            (
                betAmounts[panel] *
                currentMultiplier
            ).toFixed(2) +
            "</small>";

        button.onclick = function () {
            cashOutPanel(panel);
        };

        return;
    }


    /* =========================
       NEXT ROUND BET
    ========================= */

    if (nextBets[panel]) {

        button.classList.remove(
            "cashout"
        );

        button.classList.add(
            "next-round"
        );

        button.innerHTML =
            "<span>NEXT ROUND</span>" +
            "<small>" +
            nextBetAmounts[panel].toFixed(2) +
            "</small>" +
            "<small " +
            "style=\"font-size:12px;color:#ff1744;margin-top:5px;\">" +
            "CANCEL" +
            "</small>";

        button.onclick = function () {
            cancelNextBet(panel);
        };

        return;
    }


    /* =========================
       NORMAL BET
    ========================= */

    button.classList.remove(
        "cashout",
        "next-round"
    );

    button.innerHTML =
        "<span>BET</span>" +
        "<small id=\"display" +
        panel +
        "\">" +
        nextBetAmounts[panel].toFixed(2) +
        "</small>";

    button.onclick = function () {
        toggleBet(panel);
    };

}


/* ==========================================
   TOGGLE BET
========================================== */

function toggleBet(panel) {

    /* =========================
       CURRENT BET → CASH OUT
    ========================= */

    if (bets[panel]) {

        cashOutPanel(panel);

        return;
    }


    /* =========================
       ALREADY QUEUED
       → DO NOTHING
    ========================= */

    if (nextBets[panel]) {

        return;
    }


    const input =
        document.getElementById(
            "betAmount" + panel
        );

    if (!input) {
        return;
    }


    const amount =
        parseFloat(input.value);


    /* =========================
       VALIDATE AMOUNT
    ========================= */

    if (!amount || amount <= 0) {

        alert(
            "Enter a valid amount."
        );

        return;
    }


    if (amount > balance) {

        alert(
            "Insufficient demo balance."
        );

        return;
    }


    /* =========================
       SAVE AMOUNT
    ========================= */

    nextBetAmounts[panel] =
        amount;


    /*
       If the plane is currently flying,
       this becomes a NEXT ROUND bet.

       If betting is open, it will become
       the current bet when the round starts.
    */

    nextBets[panel] = true;


    /* =========================
       TAKE MONEY FROM BALANCE
    ========================= */

    balance -= amount;

    updateBalance();


    /* =========================
       UPDATE BUTTON
    ========================= */

    updateBetButton(panel);

}


/* ==========================================
   CANCEL NEXT-ROUND BET
========================================== */

function cancelNextBet(panel) {

    /* No queued bet */
    if (!nextBets[panel]) {
        return;
    }


    const amount =
        nextBetAmounts[panel];


    /* =========================
       RETURN MONEY
    ========================= */

    balance += amount;


    /* Remove queued bet */
    nextBets[panel] = false;


    /* =========================
       UPDATE BALANCE
    ========================= */

    updateBalance();


    /* =========================
       RESTORE NORMAL BUTTON
    ========================= */

    updateBetButton(panel);


    /* =========================
       UPDATE DISPLAY
    ========================= */

    const display =
        document.getElementById(
            "display" + panel
        );

    if (display) {

        display.textContent =
            amount.toFixed(2);

    }

}

/* ==========================================
   CASH OUT
========================================== */

function cashOutPanel(panel) {

    if (!bets[panel]) {
        return;
    }


    const amount =
        betAmounts[panel];


    const winnings =
        amount *
        currentMultiplier;


    balance += winnings;


    bets[panel] = false;


    updateBalance();

    updateBetButton(panel);


    alert(
        "Panel " +
        panel +
        " cashed out at " +
        currentMultiplier.toFixed(2) +
        "x"
    );
}


/* ==========================================
   ACTIVATE NEXT ROUND BETS
========================================== */

function activateNextRoundBets() {

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        if (nextBets[panel]) {

            bets[panel] = true;

            betAmounts[panel] =
                nextBetAmounts[panel];

            nextBets[panel] = false;
        }
    }
}


/* ==========================================
   UPDATE POTENTIAL WINNINGS
========================================== */

function updateAllPotentialWinnings() {

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        updateBetButton(panel);
    }
}


/* ==========================================
   RESET PLANE
========================================== */

function resetPlane() {

    const plane =
        el("plane");

    if (!plane) {
        return;
    }

    plane.style.left = "8%";

    plane.style.bottom = "35px";

    plane.style.transform =
        "rotate(-8deg)";
}


/* ==========================================
   START FLYING
========================================== */

function startFlyingRound() {

    clearInterval(gameTimer);

    roundFlying = true;

    bettingOpen = false;

    crashed = false;

    currentMultiplier = 1;

    resetPlane();


    /*
       Move reserved bets into
       the current round.
    */

    activateNextRoundBets();


    const overlay =
        el("roundOverlay");

    if (overlay) {

        overlay.classList.remove(
            "show"
        );
    }


    const status =
        el("roundStatus");

    if (status) {

        status.textContent =
            "FLYING";

        status.style.color =
            "#65d6ff";
    }


    const message =
        el("gameMessage");

    if (message) {

        message.textContent =
            "Round in progress...";
    }


    const multiplier =
        el("multiplier");

    if (multiplier) {

        multiplier.classList.remove(
            "crashed"
        );

        multiplier.textContent =
            "1.00x";
    }


    updateAllPotentialWinnings();


    let startTime =
        Date.now();


    gameTimer =
        setInterval(
            function () {

                const elapsed =
                    (
                        Date.now() -
                        startTime
                    ) / 1000;


                currentMultiplier =
                    1 +
                    elapsed * 0.18;


                if (multiplier) {

                    multiplier.textContent =
                        currentMultiplier
                            .toFixed(2) +
                        "x";
                }


                const plane = el("plane");

if (plane) {

    const game = document.querySelector(".game");

    const elapsedLeft =
        8 + elapsed * 3.5;

    const gameWidth =
        game ? game.clientWidth : 400;

    const planeWidth =
        plane.offsetWidth || 100;

    const maxLeft =
        ((gameWidth - planeWidth) / gameWidth) * 100;

    const safeLeft =
        Math.min(
            elapsedLeft,
            maxLeft - 2
        );

    const bottom =
        35 + elapsed * 2.2;

    plane.style.left =
        Math.max(
            0,
            safeLeft
        ) + "%";

    plane.style.bottom =
        Math.min(
            bottom,
            260
        ) + "px";
}


                updateAllPotentialWinnings();


                if (
                    currentMultiplier >=
                    window.aviatorCrashPoint
                ) {

                    crashRound();
                }

            },
            100
        );
}


/* ==========================================
   CRASH
========================================== */

function crashRound() {

    if (!roundFlying) {
        return;
    }


    clearInterval(gameTimer);

    gameTimer = null;

    roundFlying = false;

    bettingOpen = false;

    crashed = true;


    const crashPoint =
        currentMultiplier;


    const multiplier =
        el("multiplier");

    if (multiplier) {

        multiplier.textContent =
            crashPoint.toFixed(2) +
            "x";

        multiplier.classList.add(
            "crashed"
        );
    }


    /*
       Current bets lose if they
       weren't cashed out.
    */

    bets[1] = false;
    bets[2] = false;


    const crashValue =
        el("crashValue");

    if (crashValue) {

        crashValue.textContent =
            crashPoint.toFixed(2) +
            "x";
    }


    const overlay =
        el("roundOverlay");

    if (overlay) {

        overlay.classList.add(
            "show"
        );
    }


    const status =
        el("roundStatus");

    if (status) {

        status.textContent =
            "NEXT ROUND";

        status.style.color =
            "#ff1744";
    }


    const message =
        el("gameMessage");

    if (message) {

        message.textContent =
            "Waiting for next round...";
    }


    addHistoryResult(
        crashPoint
    );


    updateAllPotentialWinnings();


    startNextRoundCountdown();
}


/* ==========================================
   HISTORY
========================================== */

function addHistoryResult(value) {

    const history =
        el("history");

    if (!history) {
        return;
    }


    const item =
        document.createElement(
            "span"
        );


    item.textContent =
        value.toFixed(2) +
        "x";


    if (value < 2) {

        item.classList.add(
            "low"
        );
    }


    history.insertBefore(
        item,
        history.firstChild
    );
}


/* ==========================================
   COUNTDOWN
========================================== */

function startNextRoundCountdown() {

    clearInterval(
        countdownTimer
    );


    bettingOpen = true;


    let countdown = 10;


    const overlay =
        el("roundOverlay");

    const countdownDisplay =
        el("countdown");

    const status =
        el("roundStatus");


    if (overlay) {

        overlay.classList.add(
            "show"
        );
    }


    if (countdownDisplay) {

        countdownDisplay.textContent =
            countdown;
    }


    if (status) {

        status.textContent =
            "NEXT ROUND";

        status.style.color =
            "#ff1744";
    }


    updateBetButton(1);

    updateBetButton(2);


    countdownTimer =
        setInterval(
            function () {

                countdown--;


                if (countdownDisplay) {

                    countdownDisplay
                        .textContent =
                        countdown;
                }


                if (countdown <= 0) {

                    clearInterval(
                        countdownTimer
                    );

                    countdownTimer =
                        null;

                    bettingOpen =
                        false;


                    if (overlay) {

                        overlay.classList.remove(
                            "show"
                        );
                    }


                    createNextCrashPoint();

                    startFlyingRound();
                }

            },
            1000
        );
}


/* ==========================================
   CRASH POINT
========================================== */

function createNextCrashPoint() {

    const random =
        Math.random();


    if (random < 0.55) {

        window.aviatorCrashPoint =
            1.20 +
            Math.random() * 1.80;

    }
    else if (random < 0.85) {

        window.aviatorCrashPoint =
            3.00 +
            Math.random() * 4.00;

    }
    else if (random < 0.97) {

        window.aviatorCrashPoint =
            7.00 +
            Math.random() * 8.00;

    }
    else {

        window.aviatorCrashPoint =
            15.00 +
            Math.random() * 35.00;
    }
}


/* ==========================================
   START GAME
========================================== */

function startAviatorGame() {

    createNextCrashPoint();

    startNextRoundCountdown();
}


/* ==========================================
   PAGE START
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        updateBalance();

        updateBetButton(1);

        updateBetButton(2);

        startAviatorGame();

    }
);

</script>
</body>
</html>
