<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aviator Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a10;
    color: white;
    font-family: Arial, sans-serif;
}

/* ================= HEADER ================= */

header {
    min-height: 64px;
    background: #11141d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    gap: 8px;
    border-bottom: 1px solid #252a36;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #ff3b30;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 6px;
}

.balance {
    background: #1b202b;
    padding: 9px 12px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 13px;
}

.header-right button {
    border: none;
    border-radius: 9px;
    padding: 9px 11px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.deposit {
    background: #159447;
}

.withdraw {
    background: #b52b2b;
}

.header-icon {
    background: #1b202b;
}

.logout {
    background: #252a34;
}

/* ================= GAME ================= */

.game {
    height: 390px;
    margin: 10px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #263653 0%,
            #141c2d 35%,
            #080a10 78%
        );
}

.game::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .12;

    background-image:
        linear-gradient(#8892a8 1px, transparent 1px),
        linear-gradient(90deg, #8892a8 1px, transparent 1px);

    background-size: 55px 55px;

    transform:
        perspective(350px)
        rotateX(55deg)
        scale(1.5);

    transform-origin: bottom;
}

.history {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    gap: 7px;

    overflow-x: auto;

    z-index: 20;
}

.history::-webkit-scrollbar {
    display: none;
}

.history span {
    flex-shrink: 0;
    background: #1a202c;
    padding: 7px 11px;
    border-radius: 15px;
    font-size: 12px;
    color: #65d6ff;
}

.history span.low {
    color: #ff6565;
}

.game-status {
    position: absolute;
    top: 52px;
    left: 14px;
    right: 14px;

    display: flex;
    justify-content: space-between;

    z-index: 20;

    font-size: 11px;
    color: #9da5b5;
}

.game-status span:first-child {
    color: #ff3b30;
    font-weight: bold;
}

.multiplier {
    position: absolute;
    top: 43%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;
    z-index: 20;
    width: 100%;
}

.multiplier small {
    display: block;
    margin-bottom: 6px;

    color: #aeb5c5;
    font-size: 11px;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.multiplier strong {
    display: block;

    font-size: 64px;
    font-weight: 900;

    color: white;

    text-shadow:
        0 0 10px rgba(255,255,255,.35),
        0 0 25px rgba(255,23,68,.25);
}

.multiplier strong.crashed {
    color: #ff1744;
}

/* ================= FLIGHT PATH ================= */

.flight-path {
    position: absolute;

    width: 90%;
    height: 230px;

    left: 3%;
    bottom: 15px;

    border-top: 3px solid #ff1744;

    border-radius: 50%;

    transform: rotate(-18deg);

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,23,68,.8)
        );

    opacity: .85;
}

/* ================= PLANE ================= */

.plane {
    position: absolute;

    left: 5%;
    bottom: 35px;

    width: 100px;
    height: 55px;

    z-index: 10;

    transition:
        left .08s linear,
        bottom .08s linear,
        transform .08s linear;
}

.aircraft {
    width: 100px;
    height: 55px;

    display: block;

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,23,68,.8)
        )
        drop-shadow(
            0 0 14px
            rgba(255,23,68,.35)
        );
}

/* ================= MESSAGE ================= */

.game-message {
    position: absolute;

    bottom: 12px;
    left: 15px;
    right: 15px;

    text-align: center;

    color: #8992a5;

    font-size: 11px;

    z-index: 20;
}

/* ================= ROUND OVERLAY ================= */

.round-overlay {
    position: absolute;
    inset: 0;

    display: none;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: rgba(5,7,12,.72);

    backdrop-filter: blur(3px);

    z-index: 50;
}

.round-overlay.show {
    display: flex;
}

.crash-title {
    color: #ff1744;

    font-size: 42px;
    font-weight: 900;
}

.crash-value {
    margin-top: 5px;

    font-size: 58px;
    font-weight: 900;
}

.waiting {
    margin-top: 18px;

    color: #aeb5c5;

    font-size: 15px;
}

.countdown {
    margin-top: 5px;

    font-size: 42px;
    font-weight: 900;
}

/* ================= BETTING ================= */

.controls {
    padding: 8px;

    display: grid;

    grid-template-columns: 1fr;

    gap: 8px;

    background: #080808;
}

.bet-card {
    background: #121212;

    border: 1px solid #202020;

    border-radius: 18px;

    padding: 10px;
}

.tabs {
    width: 62%;

    margin: 0 auto 10px;

    display: flex;

    background: #0b0b0b;

    border-radius: 24px;

    padding: 3px;
}

.tabs button {
    flex: 1;

    border: none;

    background: transparent;

    color: #777;

    padding: 8px;

    border-radius: 20px;

    font-size: 14px;
}

.tabs .active {
    background: #242424;
    color: #ddd;
}

.bet-layout {
    display: grid;

    grid-template-columns: 42% 58%;

    gap: 8px;

    align-items: center;
}

.amount {
    display: grid;

    grid-template-columns:
        38px 1fr 38px;

    gap: 5px;

    align-items: center;
}

.amount-btn {
    width: 38px;
    height: 38px;

    border: none;
    border-radius: 50%;

    background: #1d222c;

    color: #aaa;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;
}

.amount input {
    width: 100%;
    height: 38px;

    border: none;

    background: transparent;

    color: #aaa;

    text-align: center;

    font-size: 18px;
    font-weight: bold;

    outline: none;
}

.quick {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 4px;

    margin-top: 5px;
}

.quick button {
    border: none;

    background: #151515;

    color: #777;

    padding: 7px 3px;

    border-radius: 18px;

    font-size: 12px;

    cursor: pointer;
}

.big-bet {
    min-height: 105px;

    width: 100%;

    border: 2px solid #42933a;

    border-radius: 15px;

    background: #126b0b;

    color: #aaa;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    cursor: pointer;
}

.big-bet span {
    font-size: 25px;
    font-weight: bold;
}

.big-bet small {
    margin-top: 3px;
    font-size: 20px;
}

.big-bet.cashout {
    background: #159447;
    border-color: #55b84b;
}

.big-bet:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* ================= MOBILE ================= */

@media (max-width: 650px) {

    header {
        padding: 7px 8px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 17px;
    }

    .header-right {
        gap: 4px;
    }

    .balance {
        padding: 8px 9px;
        font-size: 11px;
    }

    .header-right button {
        padding: 8px 6px;
        font-size: 10px;
    }

    .header-icon {
        padding: 8px !important;
    }

    .game {
        height: 360px;
        margin: 8px;
    }

    .multiplier strong {
        font-size: 50px;
    }

    .plane {
        width: 75px;
        height: 42px;
    }

    .aircraft {
        width: 75px;
        height: 42px;
    }

    .bet-layout {
        grid-template-columns: 42% 58%;
    }

    .quick button {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        ✈ <span>AVIATOR</span>
    </div>

    <div class="header-right">

        <div class="balance">
            $<span id="balance">1000.00</span>
        </div>

        <button
            class="deposit"
            onclick="alert('Deposit coming soon')">
            Deposit
        </button>

        <button
            class="withdraw"
            onclick="alert('Withdraw coming soon')">
            Withdraw
        </button>

        <button
            class="header-icon"
            onclick="alert('Menu coming soon')">
            ☰
        </button>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<!-- ================= GAME ================= -->

<section class="game">

    <div
        class="round-overlay"
        id="roundOverlay">

        <div class="crash-title">
            CRASHED
        </div>

        <div
            class="crash-value"
            id="crashValue">
            1.00x
        </div>

        <div class="waiting">
            Waiting for next round...
        </div>

        <div
            class="countdown"
            id="countdown">
            10
        </div>

    </div>


    <div
        class="history"
        id="history">

        <span>1.24x</span>
        <span>2.15x</span>
        <span>1.08x</span>
        <span>4.72x</span>
        <span>1.63x</span>
        <span>8.41x</span>

    </div>


    <div class="game-status">

        <span>AVIATOR</span>

        <span id="roundStatus">
            WAITING
        </span>

    </div>


    <div class="multiplier">

        <small>
            Current multiplier
        </small>

        <strong id="multiplier">
            1.00x
        </strong>

    </div>


    <div class="flight-path"></div>


    <div
        class="plane"
        id="plane">

        <svg
            class="aircraft"
            viewBox="0 0 200 100">

            <path
                d="M10 58 L115 45 L175 20 L188 25 L145 55 L188 70 L175 78 L115 62 L45 75 L25 68 L55 57 Z"
                fill="#ff1744"/>

            <path
                d="M75 50 L105 15 L120 18 L105 52 Z"
                fill="#ff3b30"/>

            <path
                d="M75 58 L105 88 L120 84 L105 56 Z"
                fill="#d90032"/>

            <circle
                cx="177"
                cy="28"
                r="5"
                fill="#ffb3c1"/>

        </svg>

    </div>


    <div
        class="game-message"
        id="gameMessage">

        Waiting for next round...

    </div>

</section>


<!-- ================= BETTING PANELS ================= -->

<section class="controls">


    <!-- FIRST BET PANEL -->

<div class="bet-card">

    <div class="tabs">
        <button class="active">Bet</button>
        <button>Auto</button>
    </div>

    <div class="bet-layout">

        <div class="bet-options">

            <div class="amount">

                <button
                    class="amount-btn"
                    onclick="changeAmount(1, -1)">
                    −
                </button>

                <input
                    type="number"
                    id="betAmount1"
                    value="10"
                    min="1">

                <button
                    class="amount-btn"
                    onclick="changeAmount(1, 1)">
                    +
                </button>

            </div>

            <div class="quick">

                <button onclick="setAmount(1, 100)">
                    100
                </button>

                <button onclick="setAmount(1, 250)">
                    250
                </button>

                <button onclick="setAmount(1, 1000)">
                    1,000
                </button>

                <button onclick="setAmount(1, 25000)">
                    25,000
                </button>

            </div>

        </div>

        <button
            class="big-bet"
            id="betButton1"
            onclick="toggleBet(1)">

            <span>Bet</span>

            <small id="display1">
                10.00
            </small>

        </button>

    </div>

</div>


    <!-- PANEL 2 -->

    <div class="bet-card">

        <div class="tabs">

            <button class="active">
                Bet
            </button>

            <button>
                Auto
            </button>

        </div>


        <div class="bet-layout">

            <div>

                <div class="amount">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(2,-1)">
                        −
                    </button>

                    <input
                        type="number"
                        id="betAmount2"
                        value="10"
                        min="1">

                    <button
                        class="amount-btn"
                        onclick="changeAmount(2,1)">
                        +
                    </button>

                </div>


                <div class="quick">

                    <button
                        onclick="setAmount(2,100)">
                        100
                    </button>

                    <button
                        onclick="setAmount(2,250)">
                        250
                    </button>

                    <button
                        onclick="setAmount(2,1000)">
                        1,000
                    </button>

                    <button
                        onclick="setAmount(2,25000)">
                        25,000
                    </button>

                </div>

            </div>


            <button
                class="big-bet"
                id="betButton2"
                onclick="toggleBet(2)">

                <span>Bet</span>

                <small id="display2">
                    10.00
                </small>

            </button>

        </div>

    </div>

</section>


<script>

/* =========================
   LOGIN PROTECTION
========================= */

if (localStorage.getItem("aviatorLoggedIn") !== "true") {
    window.location.replace("login.html");
}


/* =========================
   GAME VARIABLES
========================= */

let balance = 1000;

let currentMultiplier = 1.00;

let crashPoint = 0;

let gameTimer = null;

let countdownTimer = null;

let gameRunning = false;

let waitingForRound = true;


/* =========================
   TWO BET PANELS
========================= */

let bets = {
    1: false,
    2: false
};

let betAmounts = {
    1: 10,
    2: 10
};


/* =========================
   ELEMENTS
========================= */

const multiplierDisplay =
    document.getElementById("multiplier");

const plane =
    document.getElementById("plane");

const roundOverlay =
    document.getElementById("roundOverlay");

const crashValue =
    document.getElementById("crashValue");

const countdownDisplay =
    document.getElementById("countdown");

const roundStatus =
    document.getElementById("roundStatus");

const gameMessage =
    document.getElementById("gameMessage");


/* =========================
   BALANCE
========================= */

function updateBalance() {

    document.getElementById("balance")
        .textContent =
        balance.toFixed(2);

}


/* =========================
   PANEL ELEMENTS
========================= */

function getPanelInput(panel) {

    if (panel === 1) {

        return document.getElementById(
            "betAmount"
        );

    }

    return document.querySelectorAll(
        ".bet-card input[type='number']"
    )[1];

}


function getPanelButton(panel) {

    if (panel === 1) {

        return document.querySelectorAll(
            ".big-bet"
        )[0];

    }

    return document.querySelectorAll(
        ".big-bet"
    )[1];

}


/* =========================
   AMOUNT
========================= */

function setAmount(amount) {

    const input =
        getPanelInput(1);

    if (!input) return;

    input.value = amount;

    betAmounts[1] = amount;

    updateBetDisplay(1);

}


/*
   Second panel quick amount
*/

function setAmount2(amount) {

    const input =
        getPanelInput(2);

    if (!input) return;

    input.value = amount;

    betAmounts[2] = amount;

    updateBetDisplay(2);

}


/* =========================
   CHANGE AMOUNT
========================= */

function changeAmount(change) {

    changeAmountPanel(
        1,
        change
    );

}


function changeAmount2(change) {

    changeAmountPanel(
        2,
        change
    );

}


function changeAmountPanel(
    panel,
    change
) {

    if (bets[panel]) return;

    const input =
        getPanelInput(panel);

    if (!input) return;

    let value =
        parseFloat(input.value) || 1;

    value += change;

    if (value < 1) {
        value = 1;
    }

    input.value = value;

    betAmounts[panel] = value;

    updateBetDisplay(panel);

}


/* =========================
   DISPLAY BET AMOUNT
========================= */

function updateBetDisplay(panel) {

    const button =
        getPanelButton(panel);

    if (!button) return;

    if (bets[panel]) {
        return;
    }

    const amount =
        betAmounts[panel];

    const small =
        button.querySelector("small");

    if (small) {

        small.textContent =
            amount.toFixed(2);

    }

}


/* =========================
   PLACE / CASH OUT
========================= */

function toggleBet(panel) {

    if (!gameRunning) {

        alert(
            "Wait for the next round to start."
        );

        return;
    }

    if (bets[panel]) {

        cashOutPanel(panel);

        return;

    }

    const input =
        getPanelInput(panel);

    if (!input) return;

    const amount =
        parseFloat(input.value);

    if (!amount || amount <= 0) {

        alert(
            "Enter a valid amount."
        );

        return;
    }

    if (amount > balance) {

        alert(
            "Insufficient demo balance."
        );

        return;
    }


    /* Deduct bet */

    balance -= amount;

    betAmounts[panel] =
        amount;

    bets[panel] =
        true;


    /* Change button */

    const button =
        getPanelButton(panel);

    button.innerHTML =
        "<span>CASH OUT</span>" +
        "<small>" +
        amount.toFixed(2) +
        "</small>";

    button.style.background =
        "#159447";

    button.style.borderColor =
        "#55dc88";


    updateBalance();

    updateAllPotentialWinnings();

}


/* =========================
   CASH OUT
========================= */

function cashOutPanel(panel) {

    if (!bets[panel]) {
        return;
    }

    if (!gameRunning) {
        return;
    }

    const amount =
        betAmounts[panel];

    const winnings =
        amount *
        currentMultiplier;


    balance += winnings;

    bets[panel] =
        false;


    const button =
        getPanelButton(panel);

    button.innerHTML =
        "<span>Bet</span>" +
        "<small>" +
        amount.toFixed(2) +
        "</small>";

    button.style.background =
        "#126b0b";

    button.style.borderColor =
        "#42933a";


    updateBalance();

    updateAllPotentialWinnings();


    alert(
        "Cashed out at " +
        currentMultiplier.toFixed(2) +
        "x"
    );

}


/* =========================
   UPDATE WINNINGS
========================= */

function updateAllPotentialWinnings() {

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        if (!bets[panel]) {
            continue;
        }

        const button =
            getPanelButton(panel);

        if (!button) {
            continue;
        }

        const display =
            button.querySelector("small");

        if (!display) {
            continue;
        }

        const potential =
            betAmounts[panel] *
            currentMultiplier;

        display.textContent =
            potential.toFixed(2);

    }

}


/* =========================
   CRASH ACTIVE BETS
========================= */

function crashAllBets() {

    for (
        let panel = 1;
        panel <= 2;
        panel++
    ) {

        if (!bets[panel]) {
            continue;
        }


        /* Bet is lost */

        bets[panel] =
            false;


        const button =
            getPanelButton(panel);

        if (!button) {
            continue;
        }


        const amount =
            betAmounts[panel];


        button.innerHTML =
            "<span>Bet</span>" +
            "<small>" +
            amount.toFixed(2) +
            "</small>";


        button.style.background =
            "#126b0b";

        button.style.borderColor =
            "#42933a";

    }

}


/* =========================
   RESET PLANE
========================= */

function resetPlane() {

    if (!plane) return;

    plane.style.left =
        "8%";

    plane.style.bottom =
        "40px";

    plane.style.transform =
        "rotate(-8deg)";

}


/* =========================
   MOVE PLANE
========================= */

function movePlane() {

    if (!plane) return;

    /*
       Progress grows continuously.

       We use logarithmic movement so
       the aircraft remains visible even
       when multiplier becomes very high.
    */

    const progress =
        Math.min(
            Math.log(currentMultiplier) /
            Math.log(100),
            1
        );


    const left =
        8 +
        progress * 72;


    const bottom =
        40 +
        progress * 190;


    const rotation =
        -8 -
        progress * 14;


    plane.style.left =
        left + "%";

    plane.style.bottom =
        bottom + "px";

    plane.style.transform =
        "rotate(" +
        rotation +
        "deg)";

}


/* =========================
   START NEW ROUND
========================= */

function startRound() {

    waitingForRound =
        false;

    gameRunning =
        true;

    currentMultiplier =
        1.00;


    /*
       Random demo crash point.

       Minimum 1.50x.
       Maximum 100x.
    */

    crashPoint =
        1.50 +
        Math.random() *
        98.50;


    resetPlane();


    roundOverlay.classList.remove(
        "show"
    );


    multiplierDisplay.classList.remove(
        "crashed"
    );


    multiplierDisplay.textContent =
        "1.00x";


    roundStatus.textContent =
        "LIVE ROUND";


    gameMessage.textContent =
        "Place your demo bet";


    gameTimer =
        setInterval(
            function () {

                if (!gameRunning) {
                    return;
                }


                /*
                   Increase multiplier
                */

                currentMultiplier +=
                    0.03;


                multiplierDisplay.textContent =
                    currentMultiplier.toFixed(2) +
                    "x";


                /*
                   Move plane
                */

                movePlane();


                /*
                   Update both active bets
                */

                updateAllPotentialWinnings();


                /*
                   Check crash
                */

                if (
                    currentMultiplier >=
                    crashPoint
                ) {

                    crashRound();

                }

            },
            100
        );

}


/* =========================
   CRASH ROUND
========================= */

function crashRound() {

    if (!gameRunning) {
        return;
    }


    clearInterval(gameTimer);

    gameTimer =
        null;

    gameRunning =
        false;

    crashed =
        true;


    multiplierDisplay.textContent =
        "CRASHED";


    multiplierDisplay.classList.add(
        "crashed"
    );


    crashValue.textContent =
        currentMultiplier.toFixed(2) +
        "x";


    roundStatus.textContent =
        "ROUND CRASHED";


    gameMessage.textContent =
        "Round crashed";


    /*
       Remove active bets
       without returning money.
    */

    crashAllBets();


    updateBalance();


    /*
       Show crash overlay
    */

    roundOverlay.classList.add(
        "show"
    );


    /*
       Start 10-second countdown
    */

    startCountdown();

}


/* =========================
   COUNTDOWN
========================= */

function startCountdown() {

    waitingForRound =
        true;


    let countdown =
        10;


    countdownDisplay.textContent =
        countdown;


    clearInterval(
        countdownTimer
    );


    countdownTimer =
        setInterval(
            function () {

                countdown--;

                countdownDisplay.textContent =
                    countdown;


                if (
                    countdown <= 0
                ) {

                    clearInterval(
                        countdownTimer
                    );

                    countdownTimer =
                        null;


                    startRound();

                }

            },
            1000
        );

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "aviatorLoggedIn"
    );

    window.location.href =
        "index.html";

}


/* =========================
   CONNECT BUTTONS
========================= */

function connectButtons() {

    const buttons =
        document.querySelectorAll(
            ".big-bet"
        );


    if (buttons[0]) {

        buttons[0].onclick =
            function () {

                toggleBet(1);

            };

    }


    if (buttons[1]) {

        buttons[1].onclick =
            function () {

                toggleBet(2);

            };

    }

}


/* =========================
   CONNECT SECOND PANEL
========================= */

function connectSecondPanel() {

    const cards =
        document.querySelectorAll(
            ".bet-card"
        );


    if (cards.length < 2) {
        return;
    }


    const secondCard =
        cards[1];


    const amountButtons =
        secondCard.querySelectorAll(
            ".amount-btn"
        );


    if (amountButtons[0]) {

        amountButtons[0].onclick =
            function () {

                changeAmount2(-1);

            };

    }


    if (amountButtons[1]) {

        amountButtons[1].onclick =
            function () {

                changeAmount2(1);

            };

    }


    const quickButtons =
        secondCard.querySelectorAll(
            ".quick button"
        );


    if (quickButtons[0]) {

        quickButtons[0].onclick =
            function () {

                setAmount2(100);

            };

    }


    if (quickButtons[1]) {

        quickButtons[1].onclick =
            function () {

                setAmount2(250);

            };

    }


    if (quickButtons[2]) {

        quickButtons[2].onclick =
            function () {

                setAmount2(1000);

            };

    }


    if (quickButtons[3]) {

        quickButtons[3].onclick =
            function () {

                setAmount2(25000);

            };

    }

}


/* =========================
   INITIALIZE
========================= */

updateBalance();

connectButtons();

connectSecondPanel();

updateBetDisplay(1);

updateBetDisplay(2);


/*
   Start first round
*/

setTimeout(
    function () {

        startRound();

    },
    1000
);

</script>
